<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio de Artes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
</head>
<body class="bg-dark text-white text-center">
    <header class="bg-black p-3 shadow">
        <h1 class="fw-bold">Meu Portfólio de Artes</h1>
        <nav>
            <ul class="nav justify-content-center">
                <li class="nav-item"><a class="nav-link text-warning" href="#galeria">Galeria</a></li>
                <li class="nav-item"><a class="nav-link text-warning" href="#sobre">Sobre</a></li>
                <li class="nav-item"><a class="nav-link text-warning" href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <section id="galeria" class="container py-5">
        <h2>Galeria</h2>
        <div class="row g-4 justify-content-center">
            <div class="col-md-4">
                <div class="arte rounded shadow-lg" style="background-image: url('arte1.jpg');"></div>
            </div>
            <div class="col-md-4">
                <div class="arte rounded shadow-lg" style="background-image: url('arte2.jpg');"></div>
            </div>
            <div class="col-md-4">
                <div class="arte rounded shadow-lg" style="background-image: url('arte3.jpg');"></div>
            </div>
        </div>
    </section>

    <section id="sobre" class="container py-5">
        <h2>Sobre</h2>
        <p class="fs-5">Sou um artista apaixonado por expressar criatividade através de diferentes formas de arte.</p>
    </section>

    <section id="contato" class="container py-5">
        <h2>Contato</h2>
        <form class="bg-secondary p-4 rounded shadow-lg w-50 mx-auto">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome:</label>
                <input type="text" id="nome" name="nome" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="mensagem" class="form-label">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" class="form-control" required></textarea>
            </div>
            <button type="submit" class="btn btn-warning fw-bold">Enviar</button>
        </form>
    </section>

    <footer class="bg-black text-center p-3 fixed-bottom">
        <p class="m-0">&copy; 2025 Meu Nome - Todos os direitos reservados.</p>
    </footer>

    <style>
        .arte {
            width: 100%;
            height: 300px;
            background-size: cover;
            background-position: center;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }
        .arte:hover {
            transform: scale(1.05);
            box-shadow: 0px 8px 16px rgba(255, 165, 0, 0.6);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
